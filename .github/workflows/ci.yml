name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install optional checker dependency
        run: python -m pip install "jsonschema>=4,<5"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify every platform package
        run: python tools/build.py --all --dist "$RUNNER_TEMP/dist"
